name: CI

on:
  push:
    branches:
      - main
      - release-*
  pull_request: {}
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed v0.42.0-tf-9.20.0.1 packages to the fork registry
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  # Common versions
  GO_VERSION: '1.25.12'
  GOLANGCI_VERSION: 'v2.12.2'
  DOCKER_BUILDX_VERSION: 'v0.22.0'
  UP_VERSION: 'v0.38.4'

  PACKAGE_REPOSITORY: 'ghcr.io/mfroembgen/crossplane-provider-castai-api-parity'
  PACKAGE_VERSION: 'v0.42.0-tf-9.20.0.1'

jobs:
  detect-noop:
    runs-on: ubuntu-24.04
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf # v5.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.png", "**.jpg"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'

  lint:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the Go Build Cache
        id: go
        run: echo "cache=$(make go.cachedir)" >> "$GITHUB_OUTPUT"

      - name: Cache the Go Build Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go.outputs.cache }}
          key: ${{ runner.os }}-build-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-lint-

      - name: Cache Go Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Vendor Dependencies
        run: make vendor vendor.check

      # We could run 'make lint' but we prefer this action because it leaves
      # 'annotations' (i.e. it comments on PRs to point out linter violations).
      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: ${{ env.GOLANGCI_VERSION }}

  check-diff:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install goimports
        # Pin to v0.36.0: x/tools v0.37.0+ imports golang.org/x/telemetry/counter,
        # whose zip hash is not in go.sum (telemetry is not a project dependency,
        # so `go mod tidy` will not add it). Bump together with go.mod/go.sum.
        run: go install golang.org/x/tools/cmd/goimports@v0.36.0

      - name: Find the Go Build Cache
        id: go
        run: echo "cache=$(make go.cachedir)" >> "$GITHUB_OUTPUT"

      - name: Cache the Go Build Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go.outputs.cache }}
          key: ${{ runner.os }}-build-check-diff-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-check-diff-

      - name: Cache Go Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Check Diff
        run: make check-diff

  unit-tests:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the Go Build Cache
        id: go
        run: echo "cache=$(make go.cachedir)" >> "$GITHUB_OUTPUT"

      - name: Cache the Go Build Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go.outputs.cache }}
          key: ${{ runner.os }}-build-unit-tests-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-unit-tests-

      - name: Cache Go Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Run Unit Tests
        run: make -j2 test

      - name: Publish Unit Test Coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          flags: unittests
          file: _output/tests/linux_amd64/coverage.txt

  build-packages:
    runs-on: ubuntu-24.04
    needs: [lint, check-diff, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Build both packages
        env:
          BUILD_ARGS: --load
        run: |
          make -j2 BUILD_REGISTRY=local-build PLATFORMS="linux_amd64 linux_arm64" VERSION="$PACKAGE_VERSION" build.all

      - name: Verify embedded executables and Terraform schema offline
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker run --rm --network none --platform "linux/$arch" --entrypoint sh "local-build/crossplane-provider-castai-$arch" -ec '
              test -x /usr/local/bin/provider
              test -x "$TERRAFORM_NATIVE_PROVIDER_PATH"
              /usr/local/bin/provider --help >/dev/null
              mkdir -p /tmp/schema
              printf "terraform {\n  required_providers {\n    castai = {\n      source = \"castai/castai\"\n      version = \"%s\"\n    }\n  }\n}\n" "$TERRAFORM_PROVIDER_VERSION" > /tmp/schema/main.tf
              terraform -chdir=/tmp/schema init -backend=false -input=false -no-color >/dev/null
              terraform -chdir=/tmp/schema providers schema -json
            ' | jq -e '.provider_schemas["registry.terraform.io/castai/castai"].resource_schemas.castai_workload_scaling_policy.block.block_types.hpa_settings.block.block_types.native_hpa_spec' >/dev/null
          done
          grep -q 'hpaSettings:' package/crds/castai.upbound.io_scalingpolicies.yaml
          grep -q 'nativeHpaSpec:' package/crds/castai.upbound.io_scalingpolicies.yaml

      - name: Record package provenance
        run: |
          set -euo pipefail
          cd _output/xpkg
          test -s "linux_amd64/crossplane-provider-castai-$PACKAGE_VERSION.xpkg"
          test -s "linux_arm64/crossplane-provider-castai-$PACKAGE_VERSION.xpkg"
          sha256sum "linux_amd64/crossplane-provider-castai-$PACKAGE_VERSION.xpkg" "linux_arm64/crossplane-provider-castai-$PACKAGE_VERSION.xpkg" > SHA256SUMS
          jq -n --arg source "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --arg tree "$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')" \
            --arg version "$PACKAGE_VERSION" --arg run "$GITHUB_RUN_ID" \
            '{sourceCommit: $source, sourceTree: $tree, packageVersion: $version, workflowRun: $run}' > provenance.json

      - name: Upload packages and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            _output/xpkg/linux_amd64/crossplane-provider-castai-${{ env.PACKAGE_VERSION }}.xpkg
            _output/xpkg/linux_arm64/crossplane-provider-castai-${{ env.PACKAGE_VERSION }}.xpkg
            _output/xpkg/SHA256SUMS
            _output/xpkg/provenance.json

  publish-packages:
    if: github.repository == 'mfroembgen/crossplane-provider-castai' && github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build-packages
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-castai-v0.42.0-tf-9.20.0.1
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ github.sha }}
          path: _output/xpkg

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify package provenance
        run: |
          set -euo pipefail
          cd _output/xpkg
          sha256sum -c SHA256SUMS
          test "$(jq -r .sourceCommit provenance.json)" = "$GITHUB_SHA"
          test "$(jq -r .packageVersion provenance.json)" = "$PACKAGE_VERSION"

      - name: Setup crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the upstream package tool
        run: make build.init

      - name: Refuse to replace an existing version
        run: |
          set -euo pipefail
          crane ls "$PACKAGE_REPOSITORY" > "$RUNNER_TEMP/existing-tags"
          if grep -Fxq "$PACKAGE_VERSION" "$RUNNER_TEMP/existing-tags"; then
            echo "Refusing to replace $PACKAGE_REPOSITORY:$PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Publish the reviewed packages
        run: |
          set -euo pipefail
          up_cli=$(find .cache/tools -type f -name "up-$UP_VERSION" -print -quit)
          test -x "$up_cli"
          "$up_cli" xpkg push \
            --package "_output/xpkg/linux_amd64/crossplane-provider-castai-$PACKAGE_VERSION.xpkg" \
            --package "_output/xpkg/linux_arm64/crossplane-provider-castai-$PACKAGE_VERSION.xpkg" \
            "$PACKAGE_REPOSITORY:$PACKAGE_VERSION"
          digest=$(crane digest "$PACKAGE_REPOSITORY:$PACKAGE_VERSION")
          printf '%s@%s\n' "$PACKAGE_REPOSITORY" "$digest" | tee -a "$GITHUB_STEP_SUMMARY"
